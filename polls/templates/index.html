<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
</head>
<body>
<h1>This is cool </h1>
    {% if latest_question_list %}
    <ul>
    {% for question in latest_question_list %}
        <li><a href={%url 'polls:details' question.id%}>{{ question.question_text }} {{question.choice_set.count}}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif %}
</body>
</html>
